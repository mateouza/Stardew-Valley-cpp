repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format
        entry: clang-format-18 --style=file -i
        language: system
        files: '\.(cpp|h)$'
        exclude: '^common/(common_socket\.cpp|common_resolver\.cpp|common_resolvererror\.cpp|common_liberror\.cpp|socket\.h|resolver\.h|resolvererror\.h|liberror\.h|thread\.h|queue\.h)$'

      - id: cppcheck
        name: cppcheck
        entry: cppcheck
        args:
          - --enable=warning,performance,portability
          - --language=c++
          - --std=c++20
          - --error-exitcode=1
          - --library=googletest
          - --suppress=duplInheritedMember:common/queue.h
          - --suppress=passedByValue:server/world.cpp:10
          - -Icommon
          - -Iserver
          - --suppress=containerOutOfBounds:tests/map_test.cpp:41
        language: system
        files: '\.(cpp|h)$'
        exclude: '^common/(common_socket\.cpp|common_resolver\.cpp|common_resolvererror\.cpp|common_liberror\.cpp|socket\.h|resolver\.h|resolvererror\.h|liberror\.h|thread\.h|queue\.h)$'